on:
  - push
  - workflow_dispatch
jobs:
  phplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "laravel-pint"
        uses: aglipanci/laravel-pint-action@latest
        with:
          testMode: true
          useComposer: true
          pintVersion: 1.32.1
